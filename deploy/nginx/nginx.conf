upstream partner_api {
    server web:8000;
}

# HTTPS for pacific-disaster-api.spc.int is terminated by the proxy in front of
# this container; keep its X-Forwarded-Proto instead of overwriting it with http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {

    listen 80;

    # Cyclone track CSVs and risk-information GeoPackages can be large.
    client_max_body_size 100M;

    location /static/ {
        alias /code/staticfiles/;
    }

    location /media/ {
        alias /code/media/;
    }

    location / {
        proxy_pass http://partner_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

}
